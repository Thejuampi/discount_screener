name: monorepo-validation

on:
  push:
  pull_request:

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Desktop validation
        working-directory: apps/desktop
        run: |
          cargo fmt --check
          cargo test
          cargo run -- --smoke

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Android validation
        working-directory: apps/android
        run: |
          ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repository structure
        shell: pwsh
        run: ./scripts/check-repo-structure.ps1
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Shared contract validation
        shell: pwsh
        run: ./scripts/validate-contracts.ps1

  android-jvm-parity:
    # Android Opps screen (OpportunityEngine + ScreenReplay.project on the JVM) vs headless Rust,
    # field by field, on committed recorded live inputs. Offline: no market-data network calls.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Kotlin replay of recorded inputs
        env:
          PARITY_REPLAY: shared/contracts/android-jvm-parity-recorded.json
          PARITY_OUT: ${{ runner.temp }}/replay
        run: apps/android/gradlew -p tools/android-jvm-parity --no-configuration-cache run
      - name: Headless golden + field-by-field diff
        run: |
          (cd apps/windows/src-tauri && cargo test --no-default-features --lib android_)
          python3 tools/android-jvm-parity/diff_headless.py replay \
            shared/contracts/android-jvm-parity-recorded.json "${{ runner.temp }}/replay/opps.json"
      - name: Score history (append-only guard, backups, restore, headless endpoint)
        run: |
          cd apps/windows/src-tauri
          cargo test --no-default-features --lib score_history
          cargo test --no-default-features --lib history_tick
          cargo test --no-default-features --bin vantage-headless
      - name: V3.1 shadow unit tests (opportunity_v31, score_shadow_report)
        run: |
          cd apps/windows/src-tauri
          cargo test --no-default-features --lib opportunity_v31
          cargo test --no-default-features --lib score_shadow_report

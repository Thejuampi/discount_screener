# Scenario Outline manifest (FR-44).
#
# Adding a behaviour means adding a ROW to an existing Examples table. Creating a
# new Scenario Outline is the exception, and costs an entry here stating what no
# existing table covers. `tests/schema.rs` fails when an outline in a .feature
# file has no entry, or an entry names an outline that does not exist.
#
# `why_new` is the point of the whole mechanism: it forces the author to go look
# for the table that should have absorbed the case.

[[outline]]
id = "growth-posterior-fusion"
feature = "growth-posterior.feature"
name = "Growth Posterior from two Evidence Channels"
covers = "Inverse-variance fusion of the Trailing and Forward Channels, including single-channel fallback, total absence, and channel disagreement"
frs = ["FR-12", "FR-13", "FR-14", "FR-15"]
why_new = "First outline in the Core; no existing table covers channel fusion"

[[outline]]
id = "cost-of-debt-from-credit-curve"
feature = "cost-of-capital.feature"
name = "Cost of Debt from a fitted Credit Curve"
covers = "Placing an issuer on a cross-sectionally fitted spread curve, including an unfitted curve, a fit that is not monotone in leverage, and absent leverage or coverage"
frs = ["FR-20", "FR-21", "FR-26", "FR-27"]
why_new = "The growth-posterior table fuses two channels of the same quantity; this evaluates a fitted function of two different quantities and has no shared columns with it"

[[outline]]
id = "wacc-from-component-costs"
feature = "cost-of-capital.feature"
name = "WACC from cost of equity and cost of debt"
covers = "Weighting equity and after-tax debt costs, the U-shape in leverage, and the asymmetry between an absent debt cost at zero weight versus at positive weight"
frs = ["FR-20", "FR-26", "FR-27", "FR-32"]
why_new = "Separate from the cost-of-debt table because it takes component costs as given; merging them would force every curve-fitting row to carry irrelevant weight and tax columns"

[[outline]]
id = "intrinsic-value-from-fading-path"
feature = "intrinsic-value.feature"
name = "Intrinsic Value from a continuously fading growth path"
covers = "Integrating the discounted cash-flow path with the retention charge, the ordering in return on capital, the value-neutral identity for a measured return and the refusal of an absent one, the fade rate as the only horizon quantity, and the arithmetic guards on convergence and division"
frs = ["FR-18", "FR-19", "FR-27", "FR-28", "FR-29"]
why_new = "The wacc table resolves a rate from component rates; this integrates a cash-flow path over time and shares no column with it. The retention-charge rows were considered as an extension of that table and rejected because a terminal value is not a weighted average of anything"

[[outline]]
id = "business-class-from-text"
feature = "business-class.feature"
name = "Business Class from sector and industry text"
covers = "Closed-world routing of sector and industry text to a model class, the healthcare split between plans and operating health businesses, provider slugs, word-boundary matching, ineligible instruments, and the absence of any default class"
frs = ["FR-30", "FR-32"]
why_new = "Every other table takes numbers and returns a number within a chosen model; this one chooses the model, and its columns are text. There is no numeric table it could be a row of"

[[outline]]
id = "residual-income-on-book"
feature = "residual-income.feature"
name = "Residual Income on book for a financial issuer"
covers = "Valuing a financial issuer as book plus the present value of its spread over the cost of equity, the value-neutral identity for a measured return and the refusal of an absent one, the single fade rate governing both book growth and spread erosion, and the clean-surplus and convergence guards"
frs = ["FR-29", "FR-30", "FR-31", "FR-32"]
why_new = "Considered as rows of the intrinsic-value table and rejected: that table's columns are a cash flow, a return on capital and a retention charge, and none of the three exists here. Residual income starts from a stock rather than a flow, so every shared-looking column means a different quantity"

[[outline]]
id = "valuation-posterior-publication"
feature = "valuation-posterior.feature"
name = "Publishing a Valuation Posterior across the equity bridge"
covers = "The equity bridge from firm value to per-share, percentile publication and its monotone widening in every input, fixed-point quantization, and the two refusal kinds -- with uncertainty reaching neither"
frs = ["FR-3", "FR-32", "FR-33", "FR-34"]
why_new = "The intrinsic-value table ends at a firm value in the caller's own unit; this one starts from a firm value and ends at published cents, so the two share only that seam. Merging them would make every projection row carry a share count and a class"

[package]
name = "discount-screener-windows"
version = "0.1.0"
edition = "2021"

# `valuation-core` is the pure kernel being built to replace the valuation
# modules of this crate. It is a workspace member so it builds and tests with the
# app, but it is deliberately NOT yet a dependency: nothing in the Shell calls it
# until it carries the behaviour it is replacing. See the deprecation banners on
# `dcf_model`, `operating_valuation`, and `driver_resolution`.
[workspace]
members = ["valuation-core"]

[lib]
name = "discount_screener_windows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# `gui` = the Tauri desktop shell (needs webkit2gtk/gtk on Linux). Disable it
# (`--no-default-features`) to build the headless V3 daemon/CLI on a server.
default = ["gui"]
gui = [
    "dep:tauri",
    "dep:tauri-build",
    "dep:tauri-plugin-shell",
    "dep:tauri-plugin-autostart",
    "dep:tauri-plugin-single-instance",
    "dep:tauri-plugin-notification",
]

[[bin]]
name = "discount-screener-windows"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "vantage-headless"
path = "src/bin/vantage_headless.rs"

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
valuation-core = { path = "valuation-core" }
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-shell = { version = "2", optional = true }
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "native-tls"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "brotli", "cookies", "deflate", "gzip", "json", "rustls-tls"] }
rmcp = { version = "=2.2.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "reqwest"] }
rusqlite = { version = "0.32", features = ["bundled"] }
pdf-extract = "0.8"
zip = "2.2"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
keyring = { version = "3.6", features = ["windows-native"] }
sha2 = "0.10"
unicode-normalization = "0.1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
